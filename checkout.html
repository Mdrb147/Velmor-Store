<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090d16">
  <title>VELMOR — إتمام الشراء والدفع السريع</title>
  <meta name="description" content="صفحة الشراء المباشر والدفع الآمن لاشتراكات VELMOR الرقمية.">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/velmor.jpg">
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/store.css">
  <script src="/assets/checkout.js?v=3" defer></script>
</head>
<body class="checkout-page">
  <header class="checkout-header">
    <div class="container">
      <a class="wordmark" href="/" dir="ltr">VELMOR<small>CHECKOUT</small></a>
      <div class="row" style="gap:14px;">
        <span class="checkout-secure-badge">
          <svg viewBox="0 0 24 24" style="width:16px;height:16px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          دفع آمن ومشفر 100%
        </span>
        <button class="theme-toggle icon-button" data-theme-toggle aria-label="تبديل الوضع">☾</button>
        <a href="/" class="checkout-back-link">
          <span aria-hidden="true">←</span> المتجر
        </a>
      </div>
    </div>
  </header>

  <main>
    <div id="checkout-app" class="container checkout-body">
      <div class="loading-state">جاري تجهيز بيانات الدفع…</div>
    </div>
  </main>

  <footer>
    <div class="container footer-bottom" style="justify-content:center;text-align:center;">
      <span>© <span id="year"></span> VELMOR STORE — جميع الحقوق محفوظة. استلام فوري وضمان لكافة الاشتراكات.</span>
    </div>
  </footer>

  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
